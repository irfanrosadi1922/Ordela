name: Buat APK
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Isi aplikasi: bundle = dibundel di APK (update = pasang APK baru), live = membuka situs live (update otomatis)'
        type: choice
        default: bundle
        options: [bundle, live]
  push:
    tags: ['v*']
    branches: [main]
    # push ke main hanya membangun APK bila pesan commit memuat [apk]
# build baru membatalkan build lama yang belum selesai
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    name: APK ${{ matrix.app }}
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [kasir, admin]      # dua aplikasi: Ordela Kasir & Ordela Admin
    env:
      APP: ${{ matrix.app }}
      POS_DOMAIN: ${{ vars.APP_DOMAIN || 'ordela.my.id' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Siapkan isi aplikasi
        run: |
          case "$APP" in
            kasir) APPID=com.ordela.kasir; NAME="Ordela Kasir";;
            admin) APPID=com.ordela.admin; NAME="Ordela Admin";;
          esac
          echo "APPID=$APPID" >> $GITHUB_ENV
          # isi aplikasi = hasil build subdomain (profil, tab, dan pengaturan khusus aplikasi itu)
          node scripts/build-apps.mjs "$APP"
          mkdir www
          cp -r "dist/$APP/." www/
          rm -f www/CNAME www/.nojekyll
          # mode langsung (default): membuka situs live https://<app>.<domain>/ agar selalu terbaru. Isi variabel APP_LIVE=0 untuk mode luring (isi dibundel di APK).
          LIVE="${{ inputs.mode == 'live' && '1' || (inputs.mode == 'bundle' && '0' || (vars.APP_LIVE || '0')) }}"
          NAME="$NAME" APPID="$APPID" LIVE="$LIVE" URL="https://$APP.$POS_DOMAIN/" node -e "
            const c={appId:process.env.APPID,appName:process.env.NAME,webDir:'www',backgroundColor:'#ffffff'};
            if(process.env.LIVE!=='0')c.server={url:process.env.URL,cleartext:false};
            require('fs').writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          cat capacitor.config.json
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Nomor versi (dipakai pemeriksa pembaruan)
        run: |
          B=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $B/; s/versionName \"[^\"]*\"/versionName \"1.0.$B\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Izin Android (mikrofon, kamera, lokasi, Bluetooth, notifikasi), ikon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.BLUETOOTH_SCAN",
              "android.permission.POST_NOTIFICATIONS",
          ]
          anchor = '<uses-permission android:name="android.permission.INTERNET" />'
          if anchor not in s:
              raise SystemExit("INTERNET permission anchor not found; refusing to build without verifying manifest.")
          missing = [x for x in permissions if f'android:name="{x}"' not in s]
          if missing:
              insert = "\\n".join(f'    <uses-permission android:name="{x}" />' for x in missing)
              s = s.replace(anchor, anchor + "\\n" + insert, 1)
          if 'android:name="android.hardware.camera"' not in s:
              s = s.replace("</manifest>", '    <uses-feature android:name="android.hardware.camera" android:required="false" />\\n</manifest>')
          p.write_text(s)
          print("Verified permissions:")
          for x in permissions:
              if f'android:name="{x}"' not in s:
                  raise SystemExit(f"Missing permission after patch: {x}")
              print(x)
          PY
          for d in android/app/src/main/res/mipmap-*; do
            case $d in *anydpi*) rm -rf "$d"; continue;; esac
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icon-512.png "$d/$n.png"; done
          done
      - name: Plugin Bluetooth klasik (printer thermal)
        run: |
          D=android/app/src/main/java/$(echo "$APPID" | tr . /)
          mkdir -p $D
          cat > $D/ClassicBtPlugin.java <<'JAVAEOF'
          package com.ordela.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.os.Build;
          import android.util.Base64;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.io.OutputStream;
          import java.util.Set;
          import java.util.UUID;

          @CapacitorPlugin(
              name = "ClassicBt",
              permissions = { @Permission(alias = "bt", strings = { Manifest.permission.BLUETOOTH_CONNECT }) }
          )
          public class ClassicBtPlugin extends Plugin {
              private static final UUID SPP = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
              private BluetoothSocket socket;
              private OutputStream out;
              private String addr = "";

              private boolean needPerm() {
                  return Build.VERSION.SDK_INT >= 31 && getPermissionState("bt") != PermissionState.GRANTED;
              }

              @PluginMethod
              public void list(PluginCall call) {
                  if (needPerm()) {
                      requestPermissionForAlias("bt", call, "permCb");
                      return;
                  }
                  doList(call);
              }

              @PluginMethod
              public void connect(PluginCall call) {
                  if (needPerm()) {
                      requestPermissionForAlias("bt", call, "permCb");
                      return;
                  }
                  doConnect(call);
              }

              @PermissionCallback
              private void permCb(PluginCall call) {
                  if (needPerm()) {
                      call.reject("Izin Bluetooth ditolak. Izinkan di pengaturan aplikasi.");
                      return;
                  }
                  if ("list".equals(call.getMethodName())) doList(call);
                  else doConnect(call);
              }

              @SuppressLint("MissingPermission")
              private void doList(PluginCall call) {
                  BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
                  if (ad == null) {
                      call.reject("HP ini tidak punya Bluetooth");
                      return;
                  }
                  if (!ad.isEnabled()) {
                      call.reject("Bluetooth HP belum menyala");
                      return;
                  }
                  JSArray arr = new JSArray();
                  Set<BluetoothDevice> bonded = ad.getBondedDevices();
                  if (bonded != null) {
                      for (BluetoothDevice d : bonded) {
                          JSObject o = new JSObject();
                          String n = d.getName();
                          o.put("name", n == null ? "" : n);
                          o.put("address", d.getAddress());
                          arr.put(o);
                      }
                  }
                  JSObject res = new JSObject();
                  res.put("devices", arr);
                  call.resolve(res);
              }

              @SuppressLint("MissingPermission")
              private void doConnect(final PluginCall call) {
                  final String a = call.getString("address", "");
                  if (a == null || a.length() < 11) {
                      call.reject("Alamat printer kosong");
                      return;
                  }
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              closeQuiet();
                              BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
                              if (ad == null || !ad.isEnabled()) {
                                  call.reject("Bluetooth HP belum menyala");
                                  return;
                              }
                              BluetoothDevice dev = ad.getRemoteDevice(a);
                              ad.cancelDiscovery();
                              BluetoothSocket s;
                              try {
                                  s = dev.createRfcommSocketToServiceRecord(SPP);
                                  s.connect();
                              } catch (Exception e1) {
                                  s = (BluetoothSocket) dev.getClass()
                                      .getMethod("createRfcommSocket", new Class[] { int.class })
                                      .invoke(dev, Integer.valueOf(1));
                                  s.connect();
                              }
                              socket = s;
                              out = s.getOutputStream();
                              addr = a;
                              JSObject res = new JSObject();
                              res.put("connected", true);
                              call.resolve(res);
                          } catch (Exception e) {
                              closeQuiet();
                              call.reject("Gagal menyambung ke printer: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void write(final PluginCall call) {
                  final String b64 = call.getString("data", "");
                  if (out == null || socket == null) {
                      call.reject("Printer belum terhubung");
                      return;
                  }
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              byte[] bytes = Base64.decode(b64, Base64.DEFAULT);
                              int off = 0;
                              while (off < bytes.length) {
                                  int n = Math.min(512, bytes.length - off);
                                  out.write(bytes, off, n);
                                  out.flush();
                                  off += n;
                                  try { Thread.sleep(8); } catch (InterruptedException ie) { }
                              }
                              call.resolve();
                          } catch (Exception e) {
                              closeQuiet();
                              call.reject("Gagal mengirim ke printer: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void disconnect(PluginCall call) {
                  closeQuiet();
                  call.resolve();
              }

              @PluginMethod
              public void appInfo(PluginCall call) {
                  try {
                      android.content.pm.PackageInfo pi = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0);
                      JSObject res = new JSObject();
                      res.put("build", Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode);
                      res.put("version", pi.versionName);
                      res.put("id", getContext().getPackageName());
                      call.resolve(res);
                  } catch (Exception e) {
                      call.reject("Info aplikasi tidak tersedia");
                  }
              }

              @PluginMethod
              public void hasFcm(PluginCall call) {
                  int id = getContext().getResources().getIdentifier("google_app_id", "string", getContext().getPackageName());
                  JSObject res = new JSObject();
                  res.put("fcm", id != 0);
                  call.resolve(res);
              }

              @PluginMethod
              public void status(PluginCall call) {
                  JSObject res = new JSObject();
                  res.put("connected", socket != null && socket.isConnected());
                  res.put("address", addr);
                  call.resolve(res);
              }

              private void closeQuiet() {
                  try { if (out != null) out.close(); } catch (Exception e) { }
                  try { if (socket != null) socket.close(); } catch (Exception e) { }
                  out = null;
                  socket = null;
              }
          }
          JAVAEOF
          cat > $D/MainActivity.java <<'JAVAEOF'
          package com.ordela.app;

          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ClassicBtPlugin.class);
                  super.onCreate(savedInstanceState);
                  requestOrdelaPermissions();
              }

              // Minta izin mikrofon/kamera/lokasi/notifikasi/Bluetooth satu kali.
              // Izin Bluetooth tetap dikelola plugin saat fitur printer digunakan.
              private void requestOrdelaPermissions() {
                  SharedPreferences prefs = getSharedPreferences("ordela", MODE_PRIVATE);
                  if (prefs.getBoolean("runtime_permissions_requested_v2", false)) return;

                  ArrayList<String> permissions = new ArrayList<>();
                  permissions.add("android.permission.RECORD_AUDIO");
                  permissions.add("android.permission.CAMERA");
                  permissions.add("android.permission.ACCESS_FINE_LOCATION");
                  if (Build.VERSION.SDK_INT >= 33) {
                      permissions.add("android.permission.POST_NOTIFICATIONS");
                  }

                  ArrayList<String> missing = new ArrayList<>();
                  for (String permission : permissions) {
                      if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                          missing.add(permission);
                      }
                  }

                  // Tandai versi baru agar APK yang pernah meminta izin versi lama tetap meminta izin mikrofon.
                  prefs.edit().putBoolean("runtime_permissions_requested_v2", true).apply();
                  if (!missing.isEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toArray(new String[0]), 7002);
                  }
              }
          }
          JAVAEOF
          sed -i "s/com\.ordela\.app/$APPID/g" $D/*.java
          ls -la $D
      - name: Firebase (notifikasi) bila kunci tersedia
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > android/app/google-services.json
            echo 'window.POS_FCM=true;' >> www/native.js
            echo "Firebase aktif"
          else
            echo "Tanpa Firebase (notifikasi native nonaktif)"
          fi
      - run: npx cap sync android
      - name: Bangun APK rilis
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Tandatangani APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks; PASS="$KS_PASS"
          else
            PASS=ordela123
            keytool -genkeypair -keystore ks.jks -alias pos -keyalg RSA -keysize 2048 -validity 10000 -storepass $PASS -keypass $PASS -dname "CN=Ordela"
          fi
          mkdir out
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p 4 "$IN" aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-key-alias pos --ks-pass pass:$PASS --key-pass pass:$PASS --out "out/Ordela-${APP^}.apk" aligned.apk
          $BT/apksigner verify "out/Ordela-${APP^}.apk"
          [ -n "$KS_B64" ] || cp ks.jks out/KUNCI-SIMPAN-INI.jks
      - uses: actions/upload-artifact@v4
        with:
          name: Ordela-${{ matrix.app }}-apk
          path: out/*
  release:
    name: Terbitkan rilis apk-latest
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: Ordela-*-apk
          merge-multiple: true
      - name: Terbitkan (hanya bila kunci tanda tangan tetap tersedia)
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          rm -f out/KUNCI-SIMPAN-INI.jks      # kunci sementara tidak boleh dipublikasikan
          if [ -z "$KS_B64" ]; then
            echo "::warning::KEYSTORE_BASE64 belum diisi. Rilis apk-latest TIDAK diterbitkan karena APK bertanda tangan kunci sementara tidak bisa memperbarui APK sebelumnya."
            exit 0
          fi
          B=${{ github.run_number }}
          BASE="https://github.com/${{ github.repository }}/releases/download/apk-latest"
          META=$(printf '{"build":%s,"version":"1.0.%s","kasir":"%s/Ordela-Kasir.apk","admin":"%s/Ordela-Admin.apk"}' "$B" "$B" "$BASE" "$BASE")
          gh release delete apk-latest --cleanup-tag -y --repo "${{ github.repository }}" || true
          gh release create apk-latest out/*.apk --repo "${{ github.repository }}" --title "Ordela APK build $B" --notes "$META" --latest=false
          echo "$META"
