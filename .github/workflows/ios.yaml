name: Build iOS (Ordela)

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-15
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan aset web Ordela
        run: |
          mkdir -p www
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ordela.app",
            "appName": "Ordela",
            "webDir": "www",
            "backgroundColor": "#ffffff",
            "ios": {
              "contentInset": "never"
            }
          }
          EOF
          cp index.html order.html sw.js sbapi.js auth.js native.js pos2.js sso.js skin.css skin.js html5-qrcode.min.js config.js qr.js qris.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png icon-light-192.png icon-light-512.png icon-ordela-dark.svg icon-ordela-red.svg icon-ordela-maskable.svg www/
          cp -r brand www/brand

      - name: Pasang dependensi Capacitor
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/ios@^6.1.2 --no-save --no-audit --no-fund

      - name: Buat proyek iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Izin iOS (Info.plist)
        run: |
          PL=ios/App/App/Info.plist
          add() { /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PL"; }
          add NSCameraUsageDescription "Ordela memakai kamera untuk foto absensi dan foto menu."
          add NSPhotoLibraryUsageDescription "Ordela membutuhkan akses foto untuk memilih gambar menu, logo, dan foto profil."
          add NSPhotoLibraryAddUsageDescription "Ordela menyimpan foto dan struk ke galeri bila Anda memintanya."
          add NSLocationWhenInUseUsageDescription "Ordela memakai lokasi untuk mencatat tempat absen masuk dan pulang."
          add NSBluetoothAlwaysUsageDescription "Ordela memakai Bluetooth untuk menyambungkan printer struk."
          add NSBluetoothPeripheralUsageDescription "Ordela memakai Bluetooth untuk menyambungkan printer struk."
          add NSMicrophoneUsageDescription "Mikrofon dipakai bila kamera merekam video."
          plutil -lint "$PL"
          grep -A1 "UsageDescription" "$PL" | head -30

      - name: Pasang ikon Ordela
        run: |
          cp ios-icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Kompilasi iOS tanpa tanda tangan
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ordela.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Buat file .ipa (belum bertanda tangan)
        run: |
          APP=$(find "$RUNNER_TEMP/Ordela.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Ordela.ipa" Payload)
          ls -lh Ordela.ipa

      - name: Unggah Ordela.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Ordela-ipa
          path: Ordela.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Simpan hasil build untuk diperiksa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ordela-iOS-unsigned-archive
          path: ${{ runner.temp }}/Ordela.xcarchive
          if-no-files-found: ignore
          retention-days: 7
