name: SSO Worker Tests

on:
  push:
    branches: [feat/ordela-multi-app-platform]
    paths:
      - "worker/sso/**"
      - ".github/workflows/sso-worker-tests.yml"
  pull_request:
    paths:
      - "worker/sso/**"
      - ".github/workflows/sso-worker-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SSO Worker unit tests
        run: node --test worker/sso/test/worker.test.js
