name: Update Supabase Invite Email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-invite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Supabase invite email template
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: txnpqiiwdtgtfgkrquty
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          with open("email-templates/invite.html", encoding="utf-8") as f:
              html = f.read()

          payload = {
              "mailer_subjects_invite": "Kamu diundang ke Ordela, aktifkan akunmu",
              "mailer_templates_invite_content": html
          }
          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project_ref}/config/auth",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "User-Agent": "Ordela-GitHub-Actions"},
              method="PATCH"
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"Supabase API update succeeded (HTTP {response.status}).")
          except urllib.error.HTTPError as error:
              print(f"Supabase API update failed (HTTP {error.code}): {error.read().decode('utf-8', 'replace')}")
              raise
          PY
